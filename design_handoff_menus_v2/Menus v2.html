<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menus v2 — Jogo</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:oklch(0.97 0.01 140);--mute:oklch(0.82 0.03 150);--dim:oklch(0.68 0.03 155);--card:oklch(0.30 0.05 155 / .55);--card2:oklch(0.36 0.06 150 / .6);--line:oklch(0.55 0.05 150 / .25);--rev:oklch(0.62 0.11 145);--exp:oklch(0.66 0.19 25);--gk:oklch(0.28 0.02 160);--df:oklch(0.55 0.17 255);--mf:oklch(0.52 0.10 170);--fw:oklch(0.60 0.20 25);--ok:oklch(0.72 0.17 150)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Chakra Petch',system-ui,sans-serif;color:var(--ink);font-size:14px;height:100vh;overflow:hidden;background:radial-gradient(120% 70% at 55% -10%,oklch(0.62 0.10 140) 0%,oklch(0.42 0.08 150) 35%,oklch(0.24 0.05 165) 75%,oklch(0.16 0.03 170) 100%)}
a{color:var(--ok)}a:hover{color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);grid-template-rows:64px minmax(0,1fr);height:100vh}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;background:oklch(0.50 0.09 145 / .55);font-family:Oswald;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.brand i{width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-style:normal;font-size:14px}
.side{grid-row:2;background:linear-gradient(oklch(0.34 0.06 155 / .7),oklch(0.14 0.03 170 / .9));overflow-y:auto;padding:10px 12px 16px;display:flex;flex-direction:column;gap:3px;scrollbar-width:none}
.grp{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:16px 6px 6px}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:4px;font-weight:600;font-size:15px;text-align:left;transition:background .2s}
.item:hover{background:oklch(0.5 0.06 150 / .25)}
.item svg{width:20px;height:20px;flex:none}
.item .chev{margin-left:auto;width:7px;height:7px;border-left:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);transition:transform .25s}
.item.open{background:oklch(0.5 0.06 150 / .3);border-radius:4px 4px 0 0}
.item.open .chev{transform:rotate(-45deg)}
.sub{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.sub.open{grid-template-rows:1fr}
.sub>div{overflow:hidden;display:flex;flex-direction:column;background:oklch(0.5 0.06 150 / .18);border-radius:0 0 4px 4px}
.sub button{text-align:left;padding:10px 16px;font-weight:500;color:var(--mute);transition:background .2s,color .2s,padding .2s}
.sub button:hover{color:var(--ink);padding-left:20px}
.sub button.cur{color:var(--ink);font-weight:600;background:oklch(0.62 0.05 150 / .35)}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:4px}
.prem{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.prem small{font-size:10px;font-weight:600;background:var(--ok);color:oklch(0.2 0.04 160);padding:1px 6px;border-radius:3px}
.top{display:flex;align-items:center;gap:20px;padding:0 24px;background:oklch(0.55 0.09 140 / .35)}
.search{flex:1;max-width:860px;display:flex;align-items:center;gap:10px;background:oklch(0.62 0.08 140 / .45);border-radius:4px;padding:0 14px;height:34px}
.search input{flex:1;background:none;border:0;color:var(--ink);font:inherit;outline:none}
.search input::placeholder{color:oklch(0.9 0.03 140 / .7)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:4px}
.tb{width:38px;height:38px;display:grid;place-items:center;position:relative;border-radius:4px}
.tb:hover{background:oklch(0.6 0.07 145 / .35)}
.tb svg{width:20px;height:20px}
.tb.dot::after{content:"";position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--exp);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px oklch(0.66 0.19 25 / 0)}0%{box-shadow:0 0 0 0 oklch(0.66 0.19 25 / .6)}}
.club{display:flex;align-items:center;gap:10px;padding-left:16px;margin-left:8px;border-left:1px solid var(--line)}
.club b{display:block;font-weight:600}.club small{font-size:11px;color:var(--mute)}
.crest{width:38px;height:38px;border-radius:50%;background:repeating-linear-gradient(90deg,var(--ink) 0 6px,oklch(0.68 0.17 320) 6px 12px)}
main{overflow-y:auto;padding:22px 24px 40px}
.crumb{display:flex;align-items:center;gap:14px;margin-bottom:20px;font-size:15px}
.crumb h1{font-weight:500;font-size:20px;color:var(--mute);padding-right:14px;border-right:1px solid var(--line)}
.crumb b{font-weight:600}
.card{background:var(--card);border-radius:6px;padding:18px;backdrop-filter:blur(6px);box-shadow:0 8px 24px oklch(0.1 0.03 170 / .25)}
.card h3{font-weight:600;font-size:16px;margin-bottom:14px}
.rise{opacity:0;transform:translateY(14px);animation:rise .55s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{to{opacity:1;transform:none}}
.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:20px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.kpi{display:flex;justify-content:space-between;align-items:center}
.kpi small{font-size:12px;font-weight:500;color:var(--mute)}.kpi b{display:block;font-size:22px;font-weight:600;margin-top:2px}
.kpi .ico{width:46px;height:46px;border-radius:6px;background:var(--card2);display:grid;place-items:center}
.kpi .ico svg{width:22px;height:22px}
.money label{display:block;font-size:12px;color:var(--mute);margin-bottom:6px}
.money div{display:flex;background:oklch(0.48 0.06 150 / .55);border-radius:4px;overflow:hidden}
.money b{flex:1;padding:10px 14px;font-size:18px;font-weight:600}
.money span{padding:10px 14px;background:oklch(0.38 0.05 155 / .8);font-weight:600}
.facts{display:flex;flex-direction:column}
.facts div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-weight:500}
.facts div::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ink);margin:4px 10px 0 0}
.facts dt{flex:1}.facts dd{font-weight:600}
.clubhead{display:flex;align-items:center;gap:14px;margin-bottom:12px}.clubhead .crest{width:54px;height:54px}.clubhead h2{font-size:28px;font-weight:600}
.kit{display:grid;place-items:center;color:var(--mute);font-size:12px;min-height:240px;border:1px dashed var(--line);border-radius:6px}
.chart text{fill:var(--mute);font-family:'Chakra Petch';font-size:10px}
.chart .grid line{stroke:var(--line)}
.bar{transform-box:fill-box;transform:scaleY(0);animation:grow .9s cubic-bezier(.3,.8,.3,1) forwards}
.bar.up{transform-origin:bottom}.bar.dn{transform-origin:top}
@keyframes grow{to{transform:scaleY(1)}}
.legend{display:flex;gap:16px;justify-content:center;font-size:12px;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
.donut{position:relative;max-width:240px;margin:0 auto}
.donut circle.seg{transition:stroke-dasharray 1.1s cubic-bezier(.3,.8,.3,1),stroke-dashoffset 1.1s cubic-bezier(.3,.8,.3,1)}
.donut .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-family:system-ui,sans-serif}
.donut .c small{color:var(--mute);font-size:13px}.donut .c b{font-size:18px;font-weight:500;margin-top:4px}
.dleg{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin-top:12px;font-size:12px;color:var(--mute)}
.dleg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.forms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.forms button{height:94px;border-radius:4px;background:var(--card2);font-size:30px;font-weight:500;letter-spacing:.04em;border:1px solid transparent;transition:transform .2s,border-color .2s,background .2s}
.forms button:hover{border-color:var(--ink);transform:translateY(-2px)}
.forms button.cur{border-color:oklch(0.85 0.15 120);background:oklch(0.30 0.06 155 / .8);box-shadow:0 0 18px oklch(0.85 0.15 120 / .25)}
.pitch{aspect-ratio:64/100;border-radius:4px;position:relative;border:2px solid oklch(0.95 0.02 140 / .85);overflow:hidden;background:repeating-linear-gradient(0deg,oklch(0.55 0.13 145) 0 8.33%,oklch(0.51 0.13 145) 8.33% 16.66%)}
.pitch .l{position:absolute;border:2px solid oklch(0.95 0.02 140 / .85)}
.pos{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:700;padding:3px 7px;border-radius:2px;color:#fff;z-index:1;transition:left .6s cubic-bezier(.5,0,.2,1),top .6s cubic-bezier(.5,0,.2,1);box-shadow:0 3px 8px oklch(0.1 0.03 170 / .4)}
.GK{background:var(--gk)}.DF{background:var(--df)}.MF{background:var(--mf)}.FW{background:var(--fw)}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;text-align:left;padding:4px 8px 12px;color:var(--mute)}
td{padding:6px 8px;border-bottom:1px solid var(--line);font-weight:500;white-space:nowrap}
td.n,th.n{text-align:center}
td.n span{background:oklch(0.45 0.05 150 / .6);padding:2px 6px;border-radius:2px;font-size:12px;font-weight:600}
tbody tr{opacity:0;animation:rowin .4s ease forwards;animation-delay:calc(var(--i)*35ms)}
@keyframes rowin{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
tbody tr:hover td{background:oklch(0.55 0.06 150 / .2)}
tr.res td:first-child{box-shadow:inset 3px 0 oklch(0.80 0.15 85)}tr.out td:first-child{box-shadow:inset 3px 0 var(--exp)}tr.tit td:first-child{box-shadow:inset 3px 0 oklch(0.82 0.16 125)}
.tag{font-size:11px;font-weight:700;padding:2px 0;border-radius:2px;color:#fff;display:inline-block;width:34px;text-align:center}
.stars{color:var(--ink);letter-spacing:1px}.stars s{color:oklch(0.4 0.03 160);text-decoration:none}
.inj{font-size:10px;font-weight:600;background:var(--exp);padding:2px 6px;border-radius:3px;margin-left:8px}
.coach{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.coach .ph{width:96px;height:96px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:var(--dim);font-size:11px}
.coach h4{font-size:22px;font-weight:600}.coach p{color:var(--mute)}.coach p b{color:var(--ink);font-weight:500;margin-left:8px}
.skills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 24px;margin-top:12px}
.sk{display:grid;grid-template-columns:1fr 30px;gap:2px 8px;align-items:center;padding:6px 0;font-size:12px;font-weight:600}
.sk em{font-style:normal;text-align:right}
.sk .bar2{grid-column:1/-1;height:4px;background:oklch(0.4 0.04 155 / .6);border-radius:2px;overflow:hidden}
.sk .bar2 i{display:block;height:100%;width:0;background:var(--ok);border-radius:2px;transition:width 1s cubic-bezier(.3,.8,.3,1)}
.sk.hot .bar2 i{background:var(--exp)}.sk.hot span{color:oklch(0.8 0.12 25)}
.line path.ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s ease forwards .2s}
.line path.ar{opacity:0;animation:fade 1s ease forwards .8s}
.line circle{opacity:0;animation:fade .3s ease forwards;animation-delay:calc(.4s + var(--i)*110ms)}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fade{to{opacity:1}}
.toast{position:fixed;top:14px;right:18px;background:#fff;color:oklch(0.3 0.02 160);padding:12px 40px 14px 14px;border-radius:4px;display:flex;align-items:center;gap:10px;font-family:system-ui,sans-serif;font-size:14px;box-shadow:0 10px 30px oklch(0.1 0.03 170 / .35);transform:translateX(130%);animation:toast 4.5s ease forwards;overflow:hidden;z-index:9}
.toast i{width:18px;height:18px;border-radius:50%;background:var(--ok)}
.toast::after{content:"";position:absolute;left:0;bottom:0;height:3px;background:var(--ok);animation:tbar 4s linear forwards}
@keyframes toast{8%,88%{transform:none}100%{transform:translateX(130%)}}@keyframes tbar{from{width:100%}to{width:0}}
.view{animation:vin .35s ease}@keyframes vin{from{opacity:0;filter:blur(4px)}to{opacity:1;filter:none}}
.empty{min-height:300px;display:grid;place-items:center;color:var(--mute)}
@media(max-width:1100px){.split{grid-template-columns:1fr}.forms{grid-template-columns:repeat(3,minmax(0,1fr))}.skills{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.app{grid-template-columns:190px minmax(0,1fr)}.forms{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head>
<body>
<div class="app">
<div class="brand"><i>J</i>Jogos FC</div>
<header class="top">
<label class="search"><input placeholder="Procurar jogador, equipa, competição…"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg></label>
<div class="top-r">
<button class="tb dot" title="Notícias"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"></rect><circle cx="12" cy="12.5" r="3.5"></circle></svg></button>
<button class="tb" title="Calendário"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg></button>
<button class="tb" title="Mensagens"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H9l-5 4z"></path></svg></button>
<button class="tb dot" title="Notificações"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"></path></svg></button>
<div class="club"><div class="crest"></div><div><b>Pucela FC</b><small>Época 2026/27</small></div></div></div>
</header>
<nav class="side" id="side"></nav>
<main id="main"></main>
</div>
<div class="toast"><i></i>Bem-vindo, mister</div>
<script>
const I={
target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',
train:'<path d="M5 20 12 4l7 16M8 14h8"/>',
shield:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/>',
cup:'<path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v4M8 20h8"/>',
bag:'<rect x="4" y="8" width="16" height="12" rx="2"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
stats:'<rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 10h16M9 14h6"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.2 2.2M16.2 16.2l2.2 2.2M5.6 18.4l2.2-2.2M16.2 7.8l2.2-2.2"/>',
cash:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="3"/>',
crown:'<path d="M4 18h16M4 15 3 7l5 4 4-6 4 6 5-4-1 8z"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
ball:'<circle cx="12" cy="12" r="9"/><path d="m12 7 4 3-1.5 5h-5L8 10z"/>',
rocket:'<path d="M14 4c3 0 6 3 6 6l-7 7-6-6zM7 11l-3 1 2 2M13 17l-1 3-2-2M15 9h.01"/>',
cake:'<rect x="4" y="11" width="16" height="9" rx="1"/><path d="M4 15h16M12 11V7M12 5v.01"/>'};
const ic=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
const MENU=[
{g:'Clube',items:[
 {id:'prep',t:'Preparar jogo',i:'target',sub:['Próximo adversário','Táticas','Onze inicial','Estilo de jogo','Instruções de jogo','Prémios','Bilhetes']},
 {id:'treino',t:'Treino',i:'train',sub:['Técnico','Físico','Moral','Treinador de formação','Relatórios']},
 {id:'estr',t:'Estrutura',i:'shield',sub:['Informação básica','Contratos','Ambiente da equipa','Orçamento','Lesionados','Equipamento','Estádio','Staff','Sócios','Patrocinadores','Contratos de TV','Troféus']}]},
{g:'Competição',items:[{id:'comp',t:'Competição',i:'cup',sub:['Classificação','Calendário','Resultados']},{id:'merc',t:'Mercado',i:'bag',sub:['Pesquisar','Observados','Propostas']}]},
{g:'Histórico',items:[{id:'est',t:'Estatísticas',i:'stats',sub:['Jogadores','Equipa','Épocas']}]},
{g:'Outros',items:[{id:'ger',t:'Geral',i:'gear',sub:['Definições','Ajuda']}]}];
let st=JSON.parse(localStorage.getItem('menuV2')||'null')||{open:'estr',sec:'estr',page:'Informação básica',form:'4-4-2'};
const save=()=>localStorage.setItem('menuV2',JSON.stringify(st));
function renderSide(){
 let h='';
 MENU.forEach(g=>{h+=`<div class="grp">${g.g}</div>`;g.items.forEach(it=>{const o=st.open===it.id;
  h+=`<button class="item ${o?'open':''}" data-tog="${it.id}">${ic(it.i)}${it.t}<span class="chev"></span></button><div class="sub ${o?'open':''}"><div>${it.sub.map(p=>`<button class="${st.sec===it.id&&st.page===p?'cur':''}" data-sec="${it.id}" data-page="${p}">${p}</button>`).join('')}</div></div>`})});
 h+=`<div class="side-foot"><button class="item">${ic('cash')}Injeção de capital</button><button class="item">${ic('crown')}<span class="prem">Premium<small>ativo até 03/09/2027</small></span></button></div>`;
 side.innerHTML=h;
}
side.addEventListener('click',e=>{
 const t=e.target.closest('[data-tog]'),p=e.target.closest('[data-page]');
 if(t){st.open=st.open===t.dataset.tog?null:t.dataset.tog;save();renderSide()}
 if(p){st.sec=p.dataset.sec;st.page=p.dataset.page;save();renderSide();renderMain()}
});
const fmt=(n,d=2)=>n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
function countUp(root){root.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count,d=+(el.dataset.dec||0),t0=performance.now(),dur=1200;
 const f=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=fmt(to*e,d);if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
/* ---- charts ---- */
function barChart(data){
 const W=460,H=230,L=64,B=200,T=14,max=12e6,min=-4e6,y=v=>T+(max-v)/(max-min)*(B-T);
 let s=`<svg class="chart" viewBox="0 0 ${W} ${H+20}" width="100%"><g class="grid">`;
 for(let v=min;v<=max;v+=4e6){s+=`<line x1="${L}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}"></line><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${fmt(v,0)} $</text>`}
 s+='</g>';const bw=(W-L-20)/data.length;
 data.forEach((d,i)=>{const x=L+10+i*bw+bw*.2,w=bw*.5;
  s+=`<rect class="bar up" x="${x}" y="${y(d[1])}" width="${w}" height="${y(0)-y(d[1])}" fill="var(--rev)" style="animation-delay:${200+i*120}ms"></rect>`;
  s+=`<rect class="bar dn" x="${x}" y="${y(0)}" width="${w}" height="${y(-d[2])-y(0)}" fill="var(--exp)" style="animation-delay:${500+i*120}ms"></rect>`;
  s+=`<text x="${x+w/2}" y="${B+18}" text-anchor="middle">${d[0]}</text>`});
 return s+`</svg><div class="legend"><span><i style="background:var(--rev)"></i>Receita</span><span><i style="background:var(--exp)"></i>Despesa</span></div>`;
}
function donut(id,segs,label,total){
 const r=70,C=2*Math.PI*r;let s=`<div class="donut"><svg viewBox="0 0 200 200" width="100%" style="transform:rotate(-90deg)"><circle cx="100" cy="100" r="${r}" fill="none" stroke="oklch(0.2 0.03 165 / .6)" stroke-width="34"></circle>`;
 let off=0;const sum=segs.reduce((a,b)=>a+b[1],0);
 segs.forEach((g,i)=>{const len=g[1]/sum*C;s+=`<circle class="seg" data-len="${len}" data-off="${-off}" cx="100" cy="100" r="${r}" fill="none" stroke="${g[2]}" stroke-width="34" stroke-dasharray="0 ${C}" stroke-dashoffset="0" style="transition-delay:${300+i*150}ms"></circle>`;off+=len});
 return s+`</svg><div class="c"><small>${label}</small><b><span data-count="${total}" data-dec="2">0</span> $</b></div></div><div class="dleg">${segs.map(g=>`<span><i style="background:${g[2]}"></i>${g[0]}</span>`).join('')}</div>`;
}
function animDonuts(root){requestAnimationFrame(()=>requestAnimationFrame(()=>root.querySelectorAll('circle.seg').forEach(c=>{const C=2*Math.PI*70;c.setAttribute('stroke-dasharray',`${c.dataset.len} ${C}`);c.setAttribute('stroke-dashoffset',c.dataset.off)})))}
function lineChart(pts){
 const W=900,H=200,L=40,R=10,T=16,B=170,x=i=>L+i*(W-L-R)/(pts.length-1),y=v=>B-(v-30)/50*(B-T);
 const d=pts.map((v,i)=>`${i?'L':'M'}${x(i)},${y(v)}`).join(' ');
 let s=`<svg class="chart line" viewBox="0 0 ${W} ${H}" width="100%"><g class="grid">`;
 [30,50,70].forEach(v=>s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"></line><text x="${L-8}" y="${y(v)+3}" text-anchor="end">${v}%</text>`);
 s+=`</g><defs><linearGradient id="lg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="oklch(0.72 0.17 150)" stop-opacity=".45"></stop><stop offset="1" stop-color="oklch(0.72 0.17 150)" stop-opacity="0"></stop></linearGradient></defs>`;
 s+=`<path class="ar" d="${d} L${x(pts.length-1)},${B} L${x(0)},${B}Z" fill="url(#lg)"></path><path class="ln" pathLength="1" d="${d}" fill="none" stroke="var(--ok)" stroke-width="2.5"></path>`;
 pts.forEach((v,i)=>s+=`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="var(--ink)" style="--i:${i}"></circle>`);
 return s+'</svg>';
}

function slots(f){const rows=f.split('-').map(Number),out=[{r:'GK',t:'GK',x:50,y:91}];
 rows.forEach((n,ri)=>{const last=ri===rows.length-1,y=ri===0?73:last?14:73-ri*(56/(rows.length-1));
  for(let i=0;i<n;i++){let x=n===1?50:8+i*84/(n-1);if(n===2)x=i?65:35;if(n===3&&ri)x=[22,50,78][i];
   let r,t;if(ri===0){r='DF';t=n===5?['LWB','CB','CB','CB','RWB'][i]:n===4?['LB','CB','CB','RB'][i]:'CB'}
   else if(last){r='FW';t=n===3?['LW','CF','RW'][i]:n===4?['LW','CF','CF','RW'][i]:'CF'}
   else{r='MF';t=n>=4?(i===0?'LM':i===n-1?'RM':'CM'):n===1?(ri===1?'DM':'AM'):'CM'}
   out.push({r,t,x,y})}});return out}
function pitch(f){const L='<div class="l" style="left:25%;right:25%;top:-2px;height:16%"></div><div class="l" style="left:25%;right:25%;bottom:-2px;height:16%"></div><div class="l" style="left:-2px;right:-2px;top:50%;height:0;border-width:2px 0 0"></div><div class="l" style="left:50%;top:50%;width:28%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%)"></div>';
 return `<div class="pitch" id="pitch">${L}${slots(f).map((s,i)=>`<span class="pos ${s.r}" data-i="${i}" style="left:${s.x}%;top:${s.y}%">${s.t}</span>`).join('')}</div>`}
function movePitch(f){const p=document.getElementById('pitch');if(!p)return;slots(f).forEach((s,i)=>{const el=p.querySelector(`[data-i="${i}"]`);el.className='pos '+s.r;el.textContent=s.t;el.style.left=s.x+'%';el.style.top=s.y+'%'})}
